name: Security lock sync

on:
  push:
    branches:
      - security/pentest-hardening-2026-09

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pentest-hardening-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with patched Next.js
        run: npm install --package-lock-only --ignore-scripts next@16.3.4 eslint-config-next@16.3.4
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): sincronizar lockfile Next 16.3.4 [lock-sync]"
          git push origin HEAD:security/pentest-hardening-2026-09
