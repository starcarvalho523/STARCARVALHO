name: Security audit fix

on:
  push:
    branches:
      - security/pentest-hardening-2026-09

permissions:
  contents: write

jobs:
  audit-fix:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/pentest-hardening-2026-09
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit audited lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(security): aplicar npm audit fix [audit-fix]"
          git push origin HEAD:security/pentest-hardening-2026-09
