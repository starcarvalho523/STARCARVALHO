name: Security Next.js upgrade once

on:
  push:
    branches:
      - hardening/security-next-16-3-4

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/security-next-16-3-4
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade patched Next.js release and regenerate lockfile
        run: npm install --save-exact next@16.3.4 eslint-config-next@16.3.4
      - name: Remove one-shot workflow
        run: rm .github/workflows/security-next-upgrade-once.yml
      - name: Commit generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/security-next-upgrade-once.yml
          git commit -m "security(deps): upgrade Next.js to 16.3.4"
          git push origin HEAD:hardening/security-next-16-3-4
