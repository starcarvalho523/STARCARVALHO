name: One-time live payment UI fix

on:
  push:
    branches:
      - agent/live-payment-availability-audit
    paths:
      - .github/workflows/one-time-live-payment-ui-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-payment-availability-audit
      - name: Patch audited payment UI
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/app/frentista/saidas/page.tsx'): [
                  ('import { isAsaasSandboxConfigured } from "@/lib/payments/provider-factory";\n', ''),
                  ('const creditEnabled = isAsaasSandboxConfigured()&&canUsePayment(availability,"CREDIT_CARD","HOSTED_CHECKOUT","ASAAS");', 'const creditEnabled = canUsePayment(availability,"CREDIT_CARD","HOSTED_CHECKOUT","ASAAS");'),
              ],
              Path('src/app/frentista/caixa/page.tsx'): [
                  ('<Card label="PIX confirmado" value={formatMoney(shift.pix_total)} note="Integração indisponível"/>', '<Card label="PIX confirmado" value={formatMoney(shift.pix_total)}/>'),
              ],
              Path('src/app/ceo/unidades/[id]/page.tsx'): [
                  ('<CompactStat label="PIX" value="Integração pendente" icon={CircleDollarSign} />', '<CompactStat label="PIX" value={formatMoney(d.methods.PIX.amount)} icon={CircleDollarSign} />'),
                  ('{formatPaymentMethod("CARD")} e dinheiro aceitos', 'Dinheiro, PIX e crédito online disponíveis conforme configuração da unidade'),
              ],
          }

          for path, items in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  if old not in text:
                      raise SystemExit(f'Expected audited text not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-live-payment-ui-fix.yml
      - name: Commit audited UI fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/frentista/saidas/page.tsx src/app/frentista/caixa/page.tsx 'src/app/ceo/unidades/[id]/page.tsx' .github/workflows/one-time-live-payment-ui-fix.yml
          git commit -m "fix: remove stale payment integration states"
          git push origin HEAD:agent/live-payment-availability-audit
