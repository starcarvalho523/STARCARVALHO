name: Apply monthly payment card UI fix

on:
  push:
    branches:
      - fix/monthly-payment-card-persistent-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monthly-payment-card-persistent-ui
      - name: Patch payment UI
        shell: python
        run: |
          from pathlib import Path

          parent = Path('src/components/monthly-payment-actions.tsx')
          text = parent.read_text()
          replacements = [
            ('{pixEnabled?<div className={activeMethod==="PIX"?"relative sm:col-span-2":switchingTo==="PIX"?"pointer-events-none opacity-0":""}>', '{pixEnabled?<div className={`relative ${switchingTo==="PIX"?"pointer-events-none opacity-60":""}`}>'),
            ('{creditEnabled?<div className={activeMethod==="CREDIT_CARD"?"relative sm:col-span-2":switchingTo==="CREDIT_CARD"?"pointer-events-none opacity-0":""}>', '{creditEnabled?<div className={`relative ${switchingTo==="CREDIT_CARD"?"pointer-events-none opacity-60":""}`}>'),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'Expected one parent match, got {text.count(old)}')
            text = text.replace(old, new)
          parent.write_text(text)

          panel = Path('src/components/credit-checkout-panel.tsx')
          text = panel.read_text()
          old = 'return <section className="space-y-4 rounded-2xl border border-blue-200 bg-blue-50/50 p-5 sm:col-span-3"><div className="flex flex-wrap justify-between gap-3"><div><h3 className="text-lg font-bold">Pagamento com cartão de crédito</h3><p className="text-2xl font-bold text-blue-700">{money(checkout.amount)}</p><p className="mt-1 text-sm text-slate-600">Os dados do cartão são informados somente no ambiente seguro do Asaas.</p></div><span className="h-fit rounded-full bg-amber-100 px-3 py-1 text-xs font-bold text-amber-800">{checkout.state==="PAID"?"Pago":"Aguardando pagamento"}</span></div>{checkout.hostedPaymentUrl&&checkout.state!=="PAID"?<div className="grid gap-3 sm:grid-cols-2"><a href={checkout.hostedPaymentUrl} target="_blank" rel="noopener noreferrer" className="flex h-12 items-center justify-center gap-2 rounded-xl bg-blue-600 font-bold text-white"><ExternalLink className="size-4"/>Abrir pagamento seguro</a><button type="button" onClick={()=>void showQr()} className="flex h-12 items-center justify-center gap-2 rounded-xl border bg-white font-bold text-blue-700"><QrCode className="size-4"/>Mostrar QR para celular</button></div>:null}'
          new = 'return <section className="space-y-4 rounded-xl border border-blue-200 bg-blue-50/50 p-4"><div className="flex items-start gap-3"><div className="grid size-10 shrink-0 place-items-center rounded-xl bg-blue-100 text-blue-700"><CreditCard className="size-5"/></div><div className="min-w-0 flex-1"><div className="flex flex-wrap items-center justify-between gap-2"><div><p className="text-sm font-bold text-blue-900">Cartão de crédito</p><p className="text-lg font-extrabold text-blue-700">{money(checkout.amount)}</p></div><span className="h-fit rounded-full bg-amber-100 px-3 py-1 text-xs font-bold text-amber-800">{checkout.state==="PAID"?"Pago":"Checkout pronto"}</span></div><p className="mt-1 text-sm text-slate-600">Seu pagamento está preparado no ambiente seguro do Asaas.</p></div></div>{checkout.hostedPaymentUrl&&checkout.state!=="PAID"?<div className="grid gap-3 sm:grid-cols-2"><a href={checkout.hostedPaymentUrl} target="_blank" rel="noopener noreferrer" className="flex h-12 items-center justify-center gap-2 rounded-xl bg-blue-600 font-bold text-white"><ExternalLink className="size-4"/>Abrir pagamento no Asaas</a><button type="button" onClick={()=>void showQr()} className="flex h-12 items-center justify-center gap-2 rounded-xl border bg-white font-bold text-blue-700"><QrCode className="size-4"/>Mostrar QR para celular</button></div>:null}'
          if text.count(old) != 1:
            raise SystemExit(f'Expected one checkout block match, got {text.count(old)}')
          text = text.replace(old, new)
          panel.write_text(text)
      - name: Verify UI invariants
        shell: bash
        run: |
          grep -F 'Abrir pagamento no Asaas' src/components/credit-checkout-panel.tsx
          grep -F 'Checkout pronto' src/components/credit-checkout-panel.tsx
          ! grep -F 'sm:col-span-2' src/components/monthly-payment-actions.tsx
      - name: Commit UI fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/monthly-payment-actions.tsx src/components/credit-checkout-panel.tsx
          git commit -m 'fix: keep monthly card payment UI visible'
          git push origin HEAD:fix/monthly-payment-card-persistent-ui
