name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Global loading regression tests
        run: node --experimental-strip-types --test src/lib/global-loading-store.test.ts
      - name: Customer page loading regression tests
        run: node --experimental-strip-types --test src/lib/customer-data-loader.test.ts
      - name: Payment tests
        run: npm run test:payments
      - name: Security regression tests
        run: npm run test:security
      - name: Monthly domain tests
        run: npm run test:monthly
      - name: Monthly coverage tests
        run: npm run test:monthly-coverage
      - name: Monthly billing tests
        run: npm run test:monthly-billing
      - name: Customer payment tests
        run: npm run test:customer-payments
      - name: Monthly automation tests
        run: npm run test:monthly-automation
      - name: Financial environment tests
        run: npm run test:financial-environment
      - name: CEO analytics tests
        run: npm run test:ceo-analytics
      - name: Pre-go-live customer hardening tests
        run: npm run test:pre-golive

  loader-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated browser test runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Materialize CI-only routes (never shipped to Vercel)
        run: |
          mkdir -p src/app/loader-verification
          cp tests/fixtures/global-loading/page.fixture src/app/loader-verification/page.tsx
          cp tests/fixtures/global-loading/controls.fixture src/app/loader-verification/controls.tsx
      - run: npm run build
      - name: Desktop and mobile loading integration
        run: npx playwright test --config tests/loader-browser.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-browser-results
          path: test-results/
